services:
  localmap:
    build: .
    container_name: localmap
    restart: unless-stopped
    ports:
      - "8001:8001"
    volumes:
      - ./data:/app/data
    environment:
      ADMIN_TOKEN: "${ADMIN_TOKEN:?ADMIN_TOKEN must be set in .env — generate with: python3 -c \"import secrets; print(secrets.token_urlsafe(32))\"}"
      ADMIN_PATH: "${ADMIN_PATH:-}"
      SMTP_HOST: "${SMTP_HOST:-}"
      SMTP_PORT: "${SMTP_PORT:-587}"
      SMTP_USER: "${SMTP_USER:-}"
      SMTP_PASS: "${SMTP_PASS:-}"
      ADMIN_EMAIL: "${ADMIN_EMAIL:-}"
      PUSHOVER_TOKEN: "${PUSHOVER_TOKEN:-}"
      PUSHOVER_USER: "${PUSHOVER_USER:-}"
